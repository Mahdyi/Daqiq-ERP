<daqiq-page-container title="گزارش فعالیت‌ها" subtitle="مشاهده رویدادهای امنیتی و عملیاتی سامانه">
  <div pageActions class="audit-log-list__actions">
    <daqiq-button
      label="به‌روزرسانی"
      icon="pi pi-refresh"
      variant="secondary"
      [loading]="facade.loading()"
      (pressed)="handleRefresh()"
    />
  </div>

  <daqiq-card>
    <form class="audit-log-list__search" (submit)="$event.preventDefault(); handleSearchSubmit()">
      <label class="audit-log-list__search-label" for="audit-log-search">جستجو</label>
      <input
        id="audit-log-search"
        class="audit-log-list__search-input"
        type="search"
        [value]="searchTerm()"
        placeholder="جستجو در عملیات، کاربر، موجودیت یا توضیحات"
        (input)="handleSearchInput($event)"
      />
      <daqiq-button label="جستجو" icon="pi pi-search" type="submit" />
    </form>

    @if (facade.error(); as error) {
      <section class="audit-log-list__error" role="alert">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span>{{ error.message }}</span>
        <daqiq-button
          label="تلاش دوباره"
          icon="pi pi-refresh"
          variant="secondary"
          (pressed)="handleRefresh()"
        />
      </section>
    }

    @if (!facade.loading() && facade.items().length === 0 && !facade.error()) {
      <daqiq-empty-state
        icon="pi pi-history"
        message="رویدادی برای نمایش وجود ندارد."
        description="پس از انجام عملیات امنیتی یا عملیاتی، گزارش‌ها در این بخش نمایش داده می‌شوند."
      />
    } @else {
      <daqiq-data-table
        [rows]="facade.items()"
        [columns]="columns"
        [loading]="facade.loading()"
        [totalRecords]="facade.totalItems()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        rowKey="id"
        [rowActionsTemplate]="rowActions"
        (pageChange)="handlePageChange($event)"
      />
    }

    <ng-template #rowActions let-row="row">
      <div class="audit-log-list__row-actions">
        <daqiq-button
          label="جزئیات"
          icon="pi pi-eye"
          variant="text"
          (pressed)="viewDetail(row)"
        />
      </div>
    </ng-template>
  </daqiq-card>
</daqiq-page-container>
