<daqiq-page-container
  title="سفارش‌های فروش"
  subtitle="مدیریت سفارش‌های فروش مشتریان بدون ایجاد اثر مستقیم در موجودی انبار"
>
  <div pageActions class="sales-order-list__actions">
    <daqiq-button
      label="به‌روزرسانی"
      icon="pi pi-refresh"
      variant="secondary"
      [loading]="facade.loading()"
      (pressed)="handleRefresh()"
    />

    @if (facade.canCreate()) {
      <daqiq-button
        label="ایجاد سفارش فروش"
        icon="pi pi-plus"
        (pressed)="handleCreate()"
      />
    }
  </div>

  <daqiq-card>
    <form class="sales-order-list__search" (submit)="$event.preventDefault(); handleSearchSubmit()">
      <label class="sales-order-list__search-label" for="sales-order-search">جستجو</label>
      <input
        id="sales-order-search"
        class="sales-order-list__search-input"
        type="search"
        [value]="searchTerm()"
        placeholder="جستجو بر اساس شماره سفارش، مشتری یا وضعیت"
        (input)="handleSearchInput($event)"
      />
      <daqiq-button label="جستجو" icon="pi pi-search" type="submit" />
    </form>

    @if (facade.error(); as error) {
      <section class="sales-order-list__error" role="alert">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span>{{ error.message }}</span>
        <daqiq-button
          label="تلاش دوباره"
          icon="pi pi-refresh"
          variant="secondary"
          (pressed)="handleRefresh()"
        />
      </section>
    }

    @if (!facade.loading() && facade.items().length === 0 && !facade.error()) {
      <daqiq-empty-state
        icon="pi pi-file-edit"
        message="سفارش فروشی برای نمایش وجود ندارد."
        description="با ایجاد سفارش فروش جدید، داده‌ها در این بخش نمایش داده می‌شوند."
      />
    } @else {
      <daqiq-data-table
        [rows]="facade.items()"
        [columns]="columns"
        [loading]="facade.loading()"
        [totalRecords]="facade.totalItems()"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [sort]="sort()"
        rowKey="id"
        [rowActionsTemplate]="rowActions"
        (pageChange)="handlePageChange($event)"
        (sortChange)="handleSortChange($event)"
        (rowActivated)="handleView($event)"
      />
    }

    <ng-template #rowActions let-row="row">
      <div class="sales-order-list__row-actions">
        <daqiq-button
          label="جزئیات"
          icon="pi pi-eye"
          variant="text"
          (pressed)="handleView(row)"
        />

        @if (facade.canEditStatus(row.statusCode)) {
          <daqiq-button
            label="ویرایش"
            icon="pi pi-pencil"
            variant="text"
            (pressed)="handleEdit(row)"
          />
        }
      </div>
    </ng-template>
  </daqiq-card>
</daqiq-page-container>
