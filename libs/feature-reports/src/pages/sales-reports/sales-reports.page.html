<daqiq-page-container title="گزارش‌های فروش" subtitle="وضعیت سفارش‌ها، حواله‌ها و تسویه مشتریان">
  <div pageActions class="reports-page__actions">
    <daqiq-button label="به‌روزرسانی" icon="pi pi-refresh" variant="secondary" [loading]="facade.loading()" (pressed)="handleRefresh()" />
  </div>

  @if (facade.error(); as error) {
    <section class="reports-page__error" role="alert">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ error.message }}</span>
    </section>
  }

  <daqiq-card title="وضعیت سفارش‌های فروش">
    <daqiq-data-table [rows]="facade.salesOrderStatusItems()" [columns]="orderColumns" [loading]="facade.loading()" [totalRecords]="facade.salesOrderStatusItems().length" [rowKey]="statusRowKey" />
  </daqiq-card>

  <daqiq-card title="وضعیت حواله‌های فروش">
    <daqiq-data-table [rows]="facade.salesDeliveryStatusItems()" [columns]="deliveryColumns" [loading]="facade.loading()" [totalRecords]="facade.salesDeliveryStatusItems().length" [rowKey]="statusRowKey" />
  </daqiq-card>

  <daqiq-card title="تسویه فاکتورهای فروش">
    <daqiq-data-table [rows]="facade.salesSettlementItems()" [columns]="settlementColumns" [loading]="facade.loading()" [totalRecords]="facade.salesSettlementItems().length" [rowKey]="settlementRowKey" />
  </daqiq-card>
</daqiq-page-container>
