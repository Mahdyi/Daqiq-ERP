<daqiq-page-container title="گزارش‌های خرید" subtitle="وضعیت سفارش‌ها، رسیدها و تسویه تامین‌کنندگان">
  <div pageActions class="reports-page__actions">
    <daqiq-button label="به‌روزرسانی" icon="pi pi-refresh" variant="secondary" [loading]="facade.loading()" (pressed)="handleRefresh()" />
  </div>

  @if (facade.error(); as error) {
    <section class="reports-page__error" role="alert">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ error.message }}</span>
    </section>
  }

  <daqiq-card title="وضعیت سفارش‌های خرید">
    <daqiq-data-table [rows]="facade.purchaseOrderStatusItems()" [columns]="orderColumns" [loading]="facade.loading()" [totalRecords]="facade.purchaseOrderStatusItems().length" [rowKey]="statusRowKey" />
  </daqiq-card>

  <daqiq-card title="وضعیت رسیدهای خرید">
    <daqiq-data-table [rows]="facade.goodsReceiptStatusItems()" [columns]="receiptColumns" [loading]="facade.loading()" [totalRecords]="facade.goodsReceiptStatusItems().length" [rowKey]="statusRowKey" />
  </daqiq-card>

  <daqiq-card title="تسویه فاکتورهای تامین‌کننده">
    <daqiq-data-table [rows]="facade.supplierSettlementItems()" [columns]="settlementColumns" [loading]="facade.loading()" [totalRecords]="facade.supplierSettlementItems().length" [rowKey]="settlementRowKey" />
  </daqiq-card>
</daqiq-page-container>
