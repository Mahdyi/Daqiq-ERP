<daqiq-page-container title="گزارش‌های حسابداری" subtitle="خلاصه دفتر کل و فعالیت اسناد حسابداری">
  <div pageActions class="reports-page__actions">
    <daqiq-button label="به‌روزرسانی" icon="pi pi-refresh" variant="secondary" [loading]="facade.loading()" (pressed)="handleRefresh()" />
  </div>

  @if (facade.error(); as error) {
    <section class="reports-page__error" role="alert">
      <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
      <span>{{ error.message }}</span>
    </section>
  }

  <daqiq-card title="خلاصه دفتر کل">
    <daqiq-data-table [rows]="facade.generalLedgerSummaryItems()" [columns]="ledgerColumns" [loading]="facade.loading()" [totalRecords]="facade.generalLedgerSummaryItems().length" [rowKey]="ledgerRowKey" />
  </daqiq-card>

  <daqiq-card title="فعالیت اسناد حسابداری">
    <daqiq-data-table [rows]="facade.journalActivityItems()" [columns]="activityColumns" [loading]="facade.loading()" [totalRecords]="facade.journalActivityItems().length" [rowKey]="activityRowKey" />
  </daqiq-card>
</daqiq-page-container>
