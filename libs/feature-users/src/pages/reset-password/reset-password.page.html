<daqiq-page-container title="تغییر رمز عبور" subtitle="رمز عبور جدید کاربر را وارد کنید">
  <daqiq-card>
    @if (formError(); as error) {
      <section class="reset-password__error" role="alert">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span>{{ error }}</span>
      </section>
    }

    <daqiq-dynamic-form
      [fields]="fields"
      [layout]="{
        columns: 2,
        submitLabel: 'تغییر رمز عبور',
        cancelLabel: 'انصراف',
        showCancel: true
      }"
      [submitting]="facade.submitting()"
      (submitted)="handleSubmit($event)"
      (cancelled)="handleCancel()"
    />
  </daqiq-card>
</daqiq-page-container>
