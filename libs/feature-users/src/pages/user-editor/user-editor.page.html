<daqiq-page-container [title]="title" subtitle="اطلاعات کاربر و نقش‌های سامانه را مدیریت کنید">
  <daqiq-card>
    @if (facade.editorLoading()) {
      <section class="user-editor__state" role="status" aria-live="polite">
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        <span>در حال بارگذاری اطلاعات کاربر...</span>
      </section>
    } @else if (facade.editorError(); as error) {
      <section class="user-editor__error" role="alert">
        <i class="pi pi-exclamation-triangle" aria-hidden="true"></i>
        <span>{{ error.message }}</span>
        <daqiq-button
          label="تلاش دوباره"
          icon="pi pi-refresh"
          variant="secondary"
          (pressed)="handleRetry()"
        />
      </section>
    } @else {
      <section class="user-editor__roles" aria-labelledby="user-roles-title">
        <h2 id="user-roles-title">نقش‌های کاربر</h2>
        <div class="user-editor__role-grid">
          @for (role of roleOptions; track role.value) {
            <label class="user-editor__role-option">
              <input
                type="checkbox"
                [checked]="roleSelected(role.value)"
                (change)="handleRoleToggle(role.value, $event)"
              />
              <span>{{ role.label }}</span>
            </label>
          }
        </div>
      </section>

      <daqiq-dynamic-form
        [fields]="fields"
        [initialValue]="initialValue()"
        [layout]="{
          columns: 2,
          submitLabel: isEditMode ? 'به‌روزرسانی کاربر' : 'ایجاد کاربر',
          cancelLabel: 'انصراف',
          showCancel: true
        }"
        [submitting]="facade.submitting()"
        (submitted)="handleSubmit($event)"
        (cancelled)="handleCancel()"
      />
    }
  </daqiq-card>
</daqiq-page-container>
